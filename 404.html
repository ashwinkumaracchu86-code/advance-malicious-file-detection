<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var base = '/advance-malicious-file-detection';
        var path = window.location.pathname;
        var rest = path.indexOf(base) === 0 ? path.slice(base.length) : path;
        if (!rest || rest === '/') {
          rest = '/';
        }
        window.location.replace(base + '/?p=' + encodeURIComponent(rest) + window.location.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
