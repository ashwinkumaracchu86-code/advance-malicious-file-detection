<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield Background -->
  <path d="M100 15 L170 50 L170 110 Q170 150 100 185 Q30 150 30 110 L30 50 Z" 
        fill="url(#shieldGrad)" 
        stroke="#2563eb" 
        stroke-width="2"/>
  
  <!-- Inner Shield Border -->
  <path d="M100 25 L160 55 L160 108 Q160 143 100 175 Q40 143 40 108 L40 55 Z" 
        fill="url(#innerGrad)" 
        stroke="#60a5fa" 
        stroke-width="1" 
        stroke-opacity="0.3"/>
  
  <!-- Lock Body -->
  <rect x="75" y="85" width="50" height="40" rx="6" 
        fill="#1e3a5f" 
        stroke="#60a5fa" 
        stroke-width="2"/>
  
  <!-- Lock Shackle -->
  <path d="M85 85 L85 72 Q85 58 100 58 Q115 58 115 72 L115 85" 
        fill="none" 
        stroke="#60a5fa" 
        stroke-width="3" 
        stroke-linecap="round"/>
  
  <!-- Keyhole -->
  <circle cx="100" cy="100" r="5" fill="#3b82f6"/>
  <rect x="98" y="100" width="4" height="10" rx="2" fill="#3b82f6"/>
  
  <!-- Checkmark -->
  <path d="M88 100 L96 108 L115 89" 
        fill="none" 
        stroke="url(#checkGrad)" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  
  <!-- Bottom Accent -->
  <path d="M50 130 Q100 165 150 130" 
        fill="none" 
        stroke="#60a5fa" 
        stroke-width="1.5" 
        stroke-opacity="0.4"/>
</svg>
